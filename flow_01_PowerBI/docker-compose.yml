services:

  export:
    build:
      context: ./1_dockerExport
    container_name: strava_export
    volumes:
      - ./../data:/data
      - ./1_dockerExport/scripts:/scripts
    env_file:
      - .envFolder
    networks:
      - flow_01_strava_strava_network
    command: sh -c "tail -f /dev/null"

  testexport:
    build:
      context: ./2_dockerTestExport
    container_name: strava_testexport
    volumes:
      - ./2_dockerTestExport/scripts:/scripts
    env_file:
      - .env
      - .envFolder
    networks:
      - flow_01_strava_strava_network
    command: sh -c "tail -f /dev/null"
    # depends_on:
    #   export:
    #     condition: service_completed_successfully

  calcul_primes:
    build:
      context: ./3_dockerCalculPrimes
    container_name: strava_calcul_primes
    volumes:
      - ./3_dockerCalculPrimes/scripts:/scripts
      - ./../data:/data
    env_file:
      - .envFolder
      - .env
    networks:
      - flow_01_strava_strava_network
    command: sh -c "tail -f /dev/null"
    # depends_on:
    #   testexport:
    #     condition: service_completed_successfully

networks:
  flow_01_strava_strava_network:
    external: true
