version: '3.9'

services:

  # SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SQL_PASSWORD}
      - MSSQL_PID=Developer
      - MSSQL_AGENT_ENABLED=true
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
      - ./1_dockerBddSqlServer/sqlServer/entrypoint.sh:/entrypoint-custom.sh
    entrypoint: ["/bin/bash", "/entrypoint-custom.sh"]
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SQL_PASSWORD}", "-Q", "SELECT 1", "-No"]
      interval: 10s
      retries: 5
    networks:
      - strava_network

  init_db:
    build:
      context: ./1_dockerBddSqlServer/initDB
      dockerfile: Dockerfile
    container_name: strava_init_db
    depends_on:
      sqlserver:
        condition: service_healthy  # attend que SQL Server soit prêt
    environment:
      SQL_SERVER:   "sqlserver"
      SQL_DATABASE: "StravaDb"
      SQL_USER:     "sa"
      SQL_PASSWORD: "${SQL_PASSWORD}"
    restart: "no"  # s'exécute une seule fois puis s'arrête
    networks:
      - strava_network
    #command: sh -c "tail -f /dev/null"

  # Application MVC
  webapp:
    build:
      context: ./2_dockerWebAppMvc
      dockerfile: Dockerfile
    container_name: monapp
    volumes:
    - ./logs:/app/logs
    ports:
      - "44350:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=MonAppDb;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: always
    networks:
      - strava_network

  # Envoi de l'email pour récupérer les droits d'accès
  send_email:
    build:
      context: ./3_dockerSendEmail
      dockerfile: Dockerfile
    container_name: strava_email
    env_file: 
      - .env
    volumes:
      - ./3_dockerSendEmail/destinataires.xlsx:/app/destinataires.xlsx
    depends_on:
      - webapp
    restart: "no"

  # Récupération données
  getdata:
    build:
      context: ./4_dockerRecuperationDonnees
      dockerfile: Dockerfile
    container_name: getdata
    env_file:
      - .env
    networks:
      - strava_network
    restart: unless-stopped
    command: sh -c "tail -f /dev/null"

volumes:
  sqldata:

networks:
  strava_network:
    driver: bridge